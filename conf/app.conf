# Beego app config mínimo para suprimir o warning de inicialização em F1.
# Em F8+, este arquivo pode conter configs específicas do Beego (templates, sessão).
# Variáveis de ambiente (via config.Load) têm precedência sobre este arquivo.

appname = aipp
httpaddr = ""        # controlado via HTTP_ADDR env (config.Load)
httpport = 8080      # default; override via HTTP_ADDR=:PORTA
runmode = dev        # dev | prod
autorender = false   # templates não-auto-renderizados (controllers explícitos em F8)
copyrequestbody = true
EnableGzip = false   # gzip quebraria streaming SSE
