# =============================================================================
# CI/CD pipeline — AI Provider Pool (spec §3.5.3).
#
# Estratégia (DevOps consensus T3):
#   - Pipeline push-based (não GitOps no MVP — complexidade desnecessária).
#   - Triggers: push para main, qualquer PR.
#   - Release: tag `v*` dispara build+push de imagem (imutável, SHA digest).
#   - OIDC federation para auth com GHCR (sem long-lived PATs).
#   - Gates de segurança: gosec (SAST), govulncheck (deps), trivy (imagem) —
#     falham em HIGH/CRITICAL.
#   - Caching agressivo (setup-go + Docker BuildKit cache via GHA cache).
#
# Jobs:
#   1. lint-test    → go vet, go test -race, gofmt check.
#   2. security     → gosec, govulncheck (HIGH/CRITICAL = fail).
#   3. docker       → docker build + trivy image scan (CRITICAL = fail).
#   4. helm         → helm lint + helm template (2 cenários).
#   5. release      → build + push para GHCR (OIDC). Tags:
#                     - push em main   → ghcr.io/<repo>:<sha-curto> (ex.: e0f308e)
#                     - tag v*         → ghcr.io/<repo>:<tag> (ex.: v0.1.0) + latest
#                     Sempre após os 4 gates passarem (não publica imagem quebrada).
#   6. deploy       → TEMPLATE comentado (sem cluster real no MVP).
#
# Concurrency: 1 deploy por branch por vez (impede runs concorrentes que
# poderiam publicar imagem com mesma tag — improvável mas seguro).
# =============================================================================
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Permite cancelar runs superseded na mesma branch/PR (economia de actions).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permissões defaults mínimas. Jobs que precisam de mais (release) re-declaram.
permissions:
  contents: read

jobs:
  # ==========================================================================
  # 1. lint-test — Go vet + tests com race detector + gofmt check.
  # ==========================================================================
  lint-test:
    name: Lint & Test (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 para que -trimpath e timestamps façam sentido
          # (não usamos VCS info no build, mas mantemos por robustez).
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Versão pinada conforme go.mod. setup-go lê go.mod se go-version
          # estiver vazio, mas explicitamos para clareza.
          go-version-file: go.mod
          cache: true

      - name: Download deps
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        # gofmt -l lista arquivos com formatação divergente. Se a saída NÃO é
        # vazia, há arquivos não formatados → fail.
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt divergences detected in:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go test -race
        # -race: data race detector (custa 2-3x mais, mas pega bugs reais).
        # -count=1: desabilita cache de testes (queremos execução fresh).
        # -coverprofile: gera coverage para upload opcional.
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        # Opcional: codecov/coveralls se habilitado no repo. Mantemos como
        # artifact para inspeção manual.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 7

  # ==========================================================================
  # 2. security — SAST (gosec) + dependency vuln scan (govulncheck).
  # ==========================================================================
  security:
    name: Security (gosec + govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gosec — SAST para Go. Detecta sql injection, weak crypto, hardcoded
      # creds, etc. Default exit code 1 = encontrou findings. Forçamos fail
      # em severity HIGH.
      #
      # NOTA: NÃO usamos mais `securego/gosec@master` (action Docker) porque
      # o container embute Go 1.26.3 e o go.mod exige 1.26.4 → gosec não
      # conseguia carregar packages (GOTOOLCHAIN=local dentro do container
      # não baixa versão nova). Instalando via `go install` usamos o mesmo
      # Go do setup-go acima.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: gosec
        # -severity medium: fail em MEDIUM/HIGH/CRITICAL (conservador).
        # Ajuste para `low` se quiser ser mais estrito.
        run: gosec -severity medium -exclude-dir=test ./...

      # govulncheck — escaneia go.mod/go.sum contra o Vuln DB oficial do Go.
      # Reporta apenas vulns que AFETAM o código (não deps não-usadas).
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          # Por default falha em qualquer vuln encontrada. Não há flag de
          # severidade; governo trata todas como relevantes.

  # ==========================================================================
  # 3. docker — build da imagem + trivy scan (CRITICAL = fail).
  # ==========================================================================
  docker:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    permissions:
      # `permissions:` no nível do job SUBSTITUI (não estende) o do workflow.
      # Sem contents:read, o checkout falha em repositórios privados.
      contents: read
      security-events: write  # para upload SARIF do trivy (opcional).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Buildx habilita BuildKit (cache mounts, multi-stage otimizado).

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Tag local para o trivy scan; sem push (push só no job release).
          tags: ai-provider-pool:ci-scan
          load: true  # carrega a imagem no docker local do runner.
          # BuildKit cache via GHA — acelera rebuilds do workflow.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy — scanner de vulnerabilidades de imagem (OS packages + lang deps).
      # Falha em CRITICAL (exit code != 0). HIGH reporta mas não falha (decisão:
      # preferimos não bloquear PRs por HIGH transitório; ajustar se necessário).
      - name: Trivy scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ai-provider-pool:ci-scan
          # exit-code: 1 = fail no CI.
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true  # ignora CVEs sem patch disponível.
          format: table
          # Para upload SARIF (GitHub Security tab), descomente:
          # format: sarif
          # output: trivy-results.sarif

      # - name: Upload SARIF to GitHub Security
      #   if: always()
      #   uses: github/codeql-action/upload-sarif@v3
      #   with:
      #     sarif_file: trivy-results.sarif

  # ==========================================================================
  # 4. helm — valida o chart (lint + template em 2 cenários).
  # ==========================================================================
  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.17.3"  # mesma versão usada em dev (F10).

      - name: helm lint
        run: helm lint deploy/helm/ai-pool

      - name: helm template — smoke (database.url inline)
        # Smoke testa o caminho "DB externo": postgresql.enabled=false +
        # database.url inline. Se deixarmos o subchart ON (default), o chart
        # exige postgresql.auth.password e falha (ver _helpers.tpl).
        run: |
          helm template ai-pool deploy/helm/ai-pool \
            --set postgresql.enabled=false \
            --set database.url="postgres://u:p@db:5432/aipp?sslmode=require" \
            > /tmp/template-smoke.yaml
          echo "Rendered $(grep -c '^kind:' /tmp/template-smoke.yaml) resources"

      - name: helm template — full prod (ESO + ingress + networkPolicy)
        run: |
          helm template ai-pool deploy/helm/ai-pool \
            --set externalSecret.enabled=true \
            --set externalSecret.secretStoreRef.name=vault-backend \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0].host=api.example.com' \
            --set 'ingress.tls[0].secretName=ai-pool-tls' \
            --set 'ingress.tls[0].hosts[0]=api.example.com' \
            --set networkPolicy.enabled=true \
            > /tmp/template-prod.yaml
          echo "Rendered $(grep -c '^kind:' /tmp/template-prod.yaml) resources"

  # ==========================================================================
  # 5. release — build + push imagem para GHCR via OIDC.
  #
  # Triggers (após gates):
  #   - push em main       → tag = sha-curto (ex.: e0f308e)
  #   - tag v*             → tag = nome-da-tag (ex.: v0.1.0) + latest
  #
  # Em PR: não roda (não publica imagem de PR).
  # ==========================================================================
  release:
    name: Release image to GHCR
    needs: [lint-test, security, docker, helm]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      # OIDC para trocar token sem PAT. GHCR aceita GITHUB_TOKEN com packages:write.
      contents: read
      packages: write
      id-token: write  # necessário para OIDC (cosign signature futura).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        # Usa GITHUB_TOKEN automaticamente (não precisa configurar PAT).
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        # Gera tags conforme o evento:
        #   - push em main: sha-curto (ex.: e0f308e). Sem latest, sem nome de branch.
        #   - tag v*: nome-da-tag como-is (ex.: v0.1.0 — mantém prefixo v) + latest
        #             em releases estáveis (exclui -rc, -beta, -alpha).
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # SHA curto — SÓ em push para main (format=short = 7 chars).
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            # Nome da tag como-is (v0.1.0) — SÓ em push de tag.
            type=ref,event=tag
            # latest — SÓ em tag estável (sem pre-release suffix).
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64  # adicionar linux/arm64 quando testado.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build args para injeção de versão no binário (placeholder F11.1).
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.run_id }}

      # TODO (pós-MVP): Cosign signing para supply chain security (SLSA).
      # - name: Cosign sign
      #   uses: sigstore/cosign-installer@v3
      # - name: Sign image
      #   env:
      #     COSIGN_EXPERIMENTAL: "1"
      #   run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.meta.outputs.digest }}

  # ==========================================================================
  # 6. deploy — TEMPLATE COMENTADO (sem cluster real no MVP).
  # Em produção, configurar KUBE_CONFIG secret ou OIDC provider para o cluster
  # alvo. Descomentar e ajustar quando houver cluster de staging/prod.
  # ==========================================================================
