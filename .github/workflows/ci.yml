  #     - name: Configure kubectl (OIDC or kubeconfig)
  #       # Opção A: AWS EKS via OIDC (aws-actions/configure-aws-credentials).
  #       # Opção B: GCP GKE via Workload Identity.
  #       # Opção C: kubeconfig em secret (menos recomendado).
  #       uses: azure/k8s-set-context@v4
