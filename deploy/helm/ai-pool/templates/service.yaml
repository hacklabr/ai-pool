{{/* Service ClusterIP — ponto estável dentro do cluster.
     O Ingress roteia tráfego externo para este Service.
     type: ClusterIP (não LoadBalancer nem NodePort — Ingress cuida do externo).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-pool.fullname" . }}
  labels:
    {{- include "ai-pool.commonLabels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ai-pool.selectorLabels" . | nindent 4 }}
