{{/* Job de Migrations — Helm post-install/post-upgrade hook.

     CORREÇÃO vs versão anterior (0.1.0): hook mudou de pre-install para
     post-install. Motivo: com PostgreSQL como template nativo (não subchart),
     o postgres StatefulSet é um recurso regular aplicado DEPOIS dos pre-install
     hooks. Em pre-install, o Job não conseguiria resolver o DNS do Service
     do postgres. Em post-install, o StatefulSet já existe; o init container
     wait-for-db apenas espera o pod ficar Ready.

     Fluxo (install):
       1. Helm aplica todos os recursos regulares (postgres StatefulSet, app
          Deployment, Secrets, Services, Ingress, etc.).
       2. Helm roda hooks post-install (este Job).
       3. Init container wait-for-db faz loop pg_isready até postgres responder.
       4. Init container migrate roda `aipp --migrate-only` (initContainers
          rodam em sequência — migrate SEMPRE completa antes do sync).
       5. Container principal roda `aipp --sync-models` (RF-11, ADR-0015):
          a instalação já nasce com o catálogo de modelos populado.
          Falhas de provedores individuais NÃO reprovam o hook — o CLI é
          fail-safe e sai 0; exit 1 só em falha estrutural (DB/KEK).
       6. Sucesso (exit 0) → Helm declara install completo.
       7. Falha (exit 1) → Helm marca release como FAILED (visível em helm status).

     Por que dois estágios (init + main) em vez de `sh -c "migrate && sync"`:
     a imagem é distroless (sem shell). initContainers garantem a ordem
     migrate → sync com a mesma imagem.

     Efeito no app durante 1ª instalação:
       - O app Deployment começa a subir em paralelo com o postgres.
       - Sem schema, o app crasha (K8s reinicia com backoff exponencial).
       - Quando migrations completam (step 5), o app sobe com sucesso no
         próximo retry. readinessProbe impede tráfego até a app estar pronta.

     Em upgrades com RollingUpdate (maxSurge:1, maxUnavailable:0):
       - Pods antigos continuam servendo (schema antigo).
       - Pods novos crasham até migrations completar.
       - Migrations DEVEM ser backward-compatible (prática padrão).

     Annotations Helm:
       - helm.sh/hook: post-install,post-upgrade
       - helm.sh/hook-weight: "-5"
       - helm.sh/hook-delete-policy: before-hook-creation

     Idempotência: golang-migrate com advisory lock interno.
*/}}
{{- if .Values.migrations.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ai-pool.migrationJobName" . }}
  labels:
    {{- include "ai-pool.commonLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5              # 5 retries: tempo para postgres + PVC subirem
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400  # mantém Job 24h para auditoria de logs
  template:
    metadata:
      labels:
        {{- include "ai-pool.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      {{- with .Values.migrations.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.migrations.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.migrations.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if .Values.postgresql.enabled }}
        # === Init container: espera postgres ficar Ready ===
        # Necessário em post-install: o StatefulSet existe mas o pod pode
        # ainda estar inicializando (PVC binding + postgres initdb).
        - name: wait-for-db
          image: {{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at ${PGHOST}:5432..."
              until pg_isready -h "${PGHOST}" -p 5432 -U "${PGUSER}" -d "${PGDATABASE}"; do
                echo "  postgres not ready yet, retrying in 2s..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            - name: PGHOST
              value: {{ include "ai-pool.postgresqlFullname" . }}
            - name: PGUSER
              value: {{ default "aipp" .Values.postgresql.auth.username }}
            - name: PGDATABASE
              value: {{ default "aipp" .Values.postgresql.auth.database }}
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        {{- end }}
        # === Init container: migrations ===
        # Roda APÓS wait-for-db e ANTES do sync (ordem garantida pelos
        # initContainers). Falha aqui aborta o Job — nunca sincronizamos um
        # catálogo sobre schema inconsistente.
        - name: migrate
          image: {{ include "ai-pool.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Flag --migrate-only: roda RunMigrations do embed.FS e sai.
          args:
            - --migrate-only
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-pool.dbSecretName" . }}
                  key: {{ .Values.database.secretKey }}
                  optional: false
            - name: DEV_MODE
              value: "false"
            - name: SSRF_ALLOW_HTTP
              value: "false"
            - name: KEK_PATH
              value: /etc/aipp/kek
            - name: TOKEN_PEPPER_PATH
              value: /etc/aipp/token_pepper
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: app-secrets
              mountPath: /etc/aipp
              readOnly: true
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      containers:
        {{- if .Values.migrations.syncModels }}
        # === Container principal: sync do catálogo de modelos (RF-11) ===
        # Roda DEPOIS das migrations (initContainer migrate). O CLI é
        # fail-safe: provedor fora do ar/sem chave sai 0; exit 1 só em falha
        # estrutural (DB indisponível, KEK ilegível) — que DEVE reprovar o hook.
        - name: sync-models
          image: {{ include "ai-pool.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --sync-models
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-pool.dbSecretName" . }}
                  key: {{ .Values.database.secretKey }}
                  optional: false
            # DEV_MODE=false ativa validação de produção. O sync PRECISA da
            # KEK (decripta uma chave por provedor) — montamos o mesmo Secret
            # do Deployment em /etc/aipp (readOnly).
            - name: DEV_MODE
              value: "false"
            - name: SSRF_ALLOW_HTTP
              value: "false"
            - name: KEK_PATH
              value: /etc/aipp/kek
            - name: TOKEN_PEPPER_PATH
              value: /etc/aipp/token_pepper
            # Log em JSON para parsear fácil em stack (Loki/CloudWatch).
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: app-secrets
              mountPath: /etc/aipp
              readOnly: true
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
        {{- else }}
        # === Fallback p/ imagens SEM a flag --sync-models (ex.: 32fbcbb) ===
        # O initContainer migrate já aplicou o schema; o container principal
        # re-executa --migrate-only (idempotente: "no change" → exit 0) só
        # para o Job completar. Catálogo de modelos: sincronizar via botão do
        # admin (ou reverter syncModels=true após publicar imagem com a flag).
        # (nome distinto do initContainer: K8s proíbe nomes duplicados no pod)
        - name: migrate-confirm
          image: {{ include "ai-pool.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --migrate-only
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-pool.dbSecretName" . }}
                  key: {{ .Values.database.secretKey }}
                  optional: false
            - name: DEV_MODE
              value: "false"
            - name: SSRF_ALLOW_HTTP
              value: "false"
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_LEVEL
              value: "info"
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
        {{- end }}
      volumes:
        - name: app-secrets
          secret:
            secretName: {{ include "ai-pool.appSecretName" . }}
            defaultMode: 0400
{{- with .Values.image.pullSecrets }}
      imagePullSecrets:
{{- toYaml . | nindent 8 }}
{{- end }}
{{- end -}}
