{{/* Secret com DATABASE_URL — conexão PostgreSQL.

     Modos (em ordem de precedência):
     1. postgresql.enabled=true   → o template postgresql-secret.yaml cria o
                                    Secret "<release>-db" com password +
                                    DATABASE_URL apontando para o Service do
                                    postgres deste release. Aqui é NO-OP.
     2. database.existingSecret   → você JÁ TEM um Secret K8s com DATABASE_URL
                                    (DB gerenciado CloudSQL/RDS/Azure DB).
     3. externalSecret.enabled    → ExternalSecret (ESO) materializa o Secret.
     4. database.url              → chart cria um Secret Opaque com esta URL
                                    (dev/smoke test).

     Este template SÓ cria Secret nos modos 3 e 4. Nos modos 1 e 2 a fonte
     externa já provê o Secret (postgresql-secret.yaml ou pré-criado manual).
*/}}

{{/* Modo 1 (postgresql embutido) — Secret vem de postgresql-secret.yaml. */}}
{{- if .Values.postgresql.enabled -}}
{{/* no-op aqui */}}
{{- else -}}

{{/* Modo 4: database.url inline (dev/smoke apenas). */}}
{{- if and (not .Values.database.existingSecret) (not .Values.externalSecret.enabled) .Values.database.url -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-pool.dbSecretName" . }}
  labels:
    {{- include "ai-pool.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKey }}: {{ .Values.database.url | quote }}
{{- end -}}

{{/* Validação defensiva: nada configurado → falha explícita no helm install. */}}
{{- if and (not .Values.database.existingSecret) (not .Values.externalSecret.enabled) (not .Values.database.url) -}}
{{- fail "database configuration required: enable postgresql (postgresql.enabled=true), or set one of database.existingSecret, database.url, or externalSecret" -}}
{{- end -}}

{{- end -}}
