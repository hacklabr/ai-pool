{{/* Secret com DATABASE_URL — conexão PostgreSQL.
     Preferência: ExternalSecret (ver externalsecret.yaml) ou existingSecret.
     Este Secret SÓ É CRIADO se database.existingSecret E externalSecret.enabled
     AMBOS estiverem vazios — ou seja, quando o usuário quer injetar o DATABASE_URL
     via `--set database.url` (caso de smoke test ou dev K8s).

     Em produção REAL, NÃO use isto. Use ExternalSecret ou existingSecret.
*/}}
{{- if and (not .Values.database.existingSecret) (not .Values.externalSecret.enabled) .Values.database.url -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-pool.dbSecretName" . }}
  labels:
    {{- include "ai-pool.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKey }}: {{ .Values.database.url | quote }}
{{- end -}}

{{/* Validação defensiva: se nem existingSecret, nem externalSecret.enabled,
     nem database.url estão setados, falhamos no template (visível no helm install). */}}
{{- if and (not .Values.database.existingSecret) (not .Values.externalSecret.enabled) (not .Values.database.url) -}}
{{- fail "database configuration required: set one of database.existingSecret, database.url, or enable externalSecret" -}}
{{- end -}}
