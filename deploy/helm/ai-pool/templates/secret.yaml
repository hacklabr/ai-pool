{{/* Secret com DATABASE_URL — conexão PostgreSQL.

     4 modos (em ordem de precedência):
     1. postgresql.enabled=true    → chart soba Postgres (Bitnami) e cria a URL
                                     apontando p/ o serviço do subchart. Self-hosted.
     2. database.existingSecret    → você JÁ TEM um Secret K8s com a chave. Produção managed.
     3. externalSecret.enabled     → ExternalSecret (ESO) materializa o Secret.
     4. database.url               → chart cria um Secret Opaque com esta URL (dev/smoke).

     Este Secret SÓ É CRIADO nos modos 1 e 4 (quando o chart provê a URL).
*/}}

{{/* === Modo 1: PostgreSQL embutido (subchart) === */}}
{{- if .Values.postgresql.enabled -}}
{{- if not .Values.postgresql.auth.password -}}
{{- fail "postgresql.enabled=true exige postgresql.auth.password (sete via --set postgresql.auth.password=...)" -}}
{{- end -}}
{{- $pgUser := .Values.postgresql.auth.username -}}
{{- $pgPass := .Values.postgresql.auth.password -}}
{{- $pgDB := default "aipp" .Values.postgresql.auth.database -}}
{{- $pgHost := printf "%s-postgresql" .Release.Name -}}
{{- $dbURL := printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" $pgUser $pgPass $pgHost $pgDB -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-pool.dbSecretName" . }}
  labels:
    {{- include "ai-pool.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKey }}: {{ $dbURL | quote }}
{{- else -}}

{{/* === Modo 4: database.url (dev/smoke) === */}}
{{- if and (not .Values.database.existingSecret) (not .Values.externalSecret.enabled) .Values.database.url -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-pool.dbSecretName" . }}
  labels:
    {{- include "ai-pool.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKey }}: {{ .Values.database.url | quote }}
{{- end -}}

{{/* Validação defensiva: se nada foi configurado, falha (visível no helm install). */}}
{{- if and (not .Values.database.existingSecret) (not .Values.externalSecret.enabled) (not .Values.database.url) -}}
{{- fail "database configuration required: enable postgresql (postgresql.enabled=true), or set one of database.existingSecret, database.url, or externalSecret" -}}
{{- end -}}

{{- end -}}
