{{/* ExternalSecret (ESO) — materializa Secret K8s a partir de backend externo.

     Cobre DOIS Secrets:
     1. DATABASE_URL (conexao PostgreSQL, senha) — vai como env var no container.
     2. KEK + TOKEN_PEPPER — secrets de aplicação, montados como ARQUIVOS readOnly
        (defesa em profundidade: evita exposição em /proc/<pid>/environ).

     ApiVersion external-secrets.io/v1beta1 (estável desde ESO 0.9).
     Requer o CRD ExternalSecret + SecretStore instalados no cluster.

     Conditional on .Values.externalSecret.enabled=true.
*/}}
{{- if .Values.externalSecret.enabled -}}
---
# ExternalSecret para DATABASE_URL (conexao PostgreSQL).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ai-pool.dbSecretName" . }}
  labels:
    {{- include "ai-pool.commonLabels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required when externalSecret.enabled" .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    # Cria/gerencia um Secret K8s com este nome.
    name: {{ include "ai-pool.dbSecretName" . }}
    # O Secret é Opaque (stringData → data via reconciliação ESO).
    creationPolicy: Owner
  data:
    - remoteKey: ai-pool/database-url
      sourceRef:
        # Permite versionar schema do backend; v1 = formato atual.
        version: v1
      secretKey: {{ .Values.database.secretKey }}
---
# ExternalSecret para secrets de APLICAÇÃO (KEK + token_pepper).
# Estes viram arquivos readOnly montados no container (não env vars).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ai-pool.appSecretName" . }}
  labels:
    {{- include "ai-pool.commonLabels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required when externalSecret.enabled" .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "ai-pool.appSecretName" . }}
    creationPolicy: Owner
  data:
{{- range .Values.externalSecret.data }}
    - remoteKey: {{ .remoteKey }}
      secretKey: {{ .secretKey }}
      {{- with .property }}
      property: {{ . }}
      {{- end }}
{{- end }}
{{- end -}}
