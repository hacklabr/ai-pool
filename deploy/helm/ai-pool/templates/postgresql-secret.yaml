{{/* Secret do PostgreSQL — única fonte da verdade para senha + DATABASE_URL.

     Quando postgresql.enabled=true, este template cria o Secret "<release>-db"
     com DUAS chaves:
       - password      → consumida pelo StatefulSet (env POSTGRES_PASSWORD).
       - DATABASE_URL  → consumida pela app + migration-job (env DATABASE_URL).

     Senha: randômica persistente via `lookup`. Se o Secret já existe (upgrade),
     reutiliza o password atual — evita quebrar a app num `helm upgrade`.
     Se password é fornecido explicitamente em values, usa-o (rotação manual).

     DATABASE_URL: construída com a senha resolvida + host do Service do
     postgres (mesmo release). Sempre em sync com o password.

     Idempotência garantida pelo `lookup`: re-install ou upgrade não quebram.
*/}}
{{- if .Values.postgresql.enabled -}}
{{- $secretName := include "ai-pool.postgresqlSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $pgUser := default "aipp" .Values.postgresql.auth.username }}
{{- $pgDB := default "aipp" .Values.postgresql.auth.database }}
{{- $pgHost := include "ai-pool.postgresqlFullname" . }}

{{/* Resolve password: explicit value > existing Secret > random on first install. */}}
{{- $password := .Values.postgresql.auth.password }}
{{- if not $password }}
{{-   if $existing }}
{{-     $password = (index $existing.data "password") | b64dec }}
{{-   else }}
{{-     $password = randAlphaNum 24 }}
{{-   end }}
{{- end }}

{{/* Build DATABASE_URL with resolved password (kept in sync). */}}
{{- $dbURL := printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" $pgUser $password $pgHost $pgDB }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "ai-pool.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    # Descreve como o Secret foi gerado — útil para diagnóstico.
    ai-pool.hacklab.com.br/generated-password: {{ if .Values.postgresql.auth.password }}"manual"{{ else if $existing }}"reused-from-existing"{{ else }}"random-on-first-install"{{ end }}
type: Opaque
stringData:
  password: {{ $password | quote }}
  {{ .Values.database.secretKey }}: {{ $dbURL | quote }}
{{- end -}}
