{{/* ServiceAccount — identidade do pod no cluster.
     O app NÃO fala com K8s API (zero RBAC necessário), mas criamos SA para:
     - Isolamento (não usar "default" SA que pode ter permissões herdadas).
     - Auditoria (logs de audit mostram qual SA acessou o quê).
     - Future-proofing (quando Health probes ativos chegarem, podem precisar).
*/}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-pool.serviceAccountName" . }}
  labels:
    {{- include "ai-pool.commonLabels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Sem automount de token: o app não fala com K8s API. Reduz risco em comprometimento.
# Para habilitar (se futuro precisar): automountServiceAccountToken: true.
automountServiceAccountToken: false
{{- end -}}
